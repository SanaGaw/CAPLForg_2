[project]
name = "capl-forge"
version = "0.1.0"
description = "CANoe Project Knowledge Extraction and Resolution System"
requires-python = ">=3.10"
dependencies = [
    "click>=8.0.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "openpyxl>=3.0.0",
    "cantools>=39.0",
    "requests>=2.28.0",
    "jsonschema>=4.0.0",
    "streamlit>=1.28.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0", "ruff>=0.1.0", "tiktoken"]
llm = ["tiktoken"]

[project.scripts]
capl-forge = "capl_forge.cli.__main__:cli"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
